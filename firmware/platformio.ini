[env:pico_main]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_src_filter = +<hardware.cpp> +<control.cpp> +<states.cpp> +<main.cpp> +<swingup.cpp> +<joystick.cpp>

[env:pico_exp_b]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_src_filter = +<hardware.cpp> +<control.cpp> +<states.cpp> +<exp_b.cpp>

[env:pico_exp_a]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_src_filter = +<hardware.cpp> +<control.cpp> +<states.cpp> +<exp_a.cpp>

[env:pico_joystick]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
build_src_filter = +<hardware.cpp> +<control.cpp> +<states.cpp> +<main.cpp> +<joystick.cpp> +<swingup.cpp>
